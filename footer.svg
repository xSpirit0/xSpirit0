<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" fill="none">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="110" rx="20" fill="#05070b"/>

  <g filter="url(#blur)">
    <circle cx="260" cy="70" r="55" fill="#1f6feb" opacity="0.55"/>
    <circle cx="760" cy="40" r="60" fill="#6e40c9" opacity="0.4"/>
  </g>

  <rect x="250" y="25" width="500" height="60" rx="22" fill="url(#glass)"/>
  <rect x="250.5" y="25.5" width="499" height="59" rx="21.5" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M275 26.5 H725" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>

  <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#c9d1d9" letter-spacing="3" opacity="0.85">THANKS FOR STOPPING BY</text>
</svg>
