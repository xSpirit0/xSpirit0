<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ecbff"/>
    </linearGradient>
  </defs>

  <!-- black base -->
  <rect width="1000" height="260" rx="20" fill="#05070b"/>

  <!-- soft glow blobs behind the glass -->
  <g filter="url(#blur)">
    <circle cx="190" cy="70" r="85" fill="#1f6feb" opacity="0.65"/>
    <circle cx="820" cy="200" r="95" fill="#6e40c9" opacity="0.45"/>
    <circle cx="560" cy="40" r="55" fill="#58a6ff" opacity="0.35"/>
  </g>

  <!-- frosted glass card -->
  <rect x="150" y="45" width="700" height="170" rx="28" fill="url(#glass)"/>
  <rect x="150.5" y="45.5" width="699" height="169" rx="27.5" stroke="url(#edge)" stroke-width="1.2"/>
  <!-- top highlight -->
  <path d="M180 46.5 H820" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>

  <!-- text -->
  <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#title)" letter-spacing="1">Ali</text>
  <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1d9" letter-spacing="4" opacity="0.9">FULL-STACK  &amp;  MOBILE DEV</text>
  <circle cx="500" cy="190" r="2.5" fill="#58a6ff"/>
</svg>
